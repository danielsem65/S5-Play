name: Build

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

env:
  BUILD_TYPE: Release

jobs:
  build:
    runs-on: windows-2022
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Setup Visual Studio environment
        uses: ilammy/msvc-dev-cmd@v1

      - name: Setup Ninja
        uses: seanmiddleditch/gha-setup-ninja@v5

      - name: Install glslang
        shell: pwsh
        run: |
          $vcpkgRoot = Split-Path (Get-Command vcpkg).Source
          vcpkg install glslang[tools,opt]:x64-windows
          "$vcpkgRoot\installed\x64-windows\tools\glslang" |
            Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append

      - name: Install Qt 6
        uses: jurplel/install-qt-action@v4
        with:
          version: "6.8.0"
          host: windows
          target: desktop
          arch: win64_msvc2022_64
          cache: true

      - name: Install Vulkan SDK
        run: |
          $installer = "$env:TEMP\VulkanSDK.exe"
          Invoke-WebRequest -Uri "https://sdk.lunarg.com/sdk/download/1.3.296.0/windows/VulkanSDK-1.3.296.0-Installer.exe" -OutFile $installer
          Start-Process -Wait -FilePath $installer -ArgumentList "--root C:\VulkanSDK --accept-licenses --default-answer --confirm-command install"
          echo "VULKAN_SDK=C:\VulkanSDK" | Out-File -FilePath $env:GITHUB_ENV -Append

      - name: Verify toolchain
        shell: cmd
        run: |
          cmake --version
          ninja --version
          clang-cl --version
          glslangValidator --version
          echo Qt6_DIR=%Qt6_DIR%

      - name: Configure
        shell: cmd
        run: |
          cmake -S src -B build -G Ninja ^
            -DCMAKE_BUILD_TYPE=%BUILD_TYPE% ^
            -DCMAKE_C_COMPILER=clang-cl ^
            -DCMAKE_CXX_COMPILER=clang-cl ^
            -DCMAKE_PREFIX_PATH="%Qt6_DIR%"

      - name: Build
        shell: cmd
        run: ninja -C build

      - name: Stage artifacts
        shell: pwsh
        run: |
          mkdir staging
          Copy-Item build/launcher/* staging/ -Recurse
          Copy-Item build/kyty_emulator.exe staging/
          Copy-Item build/libwinpthread-1.dll staging/

      - name: Upload Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: s5play-windows
          path: staging/
          if-no-files-found: error
